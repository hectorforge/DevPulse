services:
  db:
    image: postgres:15-alpine
    container_name: devpulse_db
    restart: always
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=devpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devpulse_db"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: